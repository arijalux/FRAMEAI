<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad2" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="60%" stop-color="#F0EDE6" />
      <stop offset="100%" stop-color="#E3DFD5" />
    </radialGradient>
    <linearGradient id="sonoGrain" x1="0%" y1="0%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#2B1E19" />
      <stop offset="30%" stop-color="#3D2C24" />
      <stop offset="60%" stop-color="#1F1410" />
      <stop offset="85%" stop-color="#36251E" />
      <stop offset="100%" stop-color="#18100D" />
    </linearGradient>
    <linearGradient id="darkHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.02)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.5)" />
    </linearGradient>
    <filter id="softShadow2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#1A1412" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad2)" />
  <ellipse cx="400" cy="350" rx="280" ry="65" fill="rgba(20,15,12,0.18)" filter="blur(18px)" />

  <g transform="translate(400, 305) scale(1.05)" filter="url(#softShadow2)">
    <!-- Folded Dark Temples Behind -->
    <path d="M-270,-10 C-230,45 -170,70 -90,78 C-50,80 50,80 90,78 C170,70 230,45 270,-10" 
          fill="none" stroke="url(#sonoGrain)" stroke-width="16" stroke-linecap="round" opacity="0.9" />

    <!-- Left Round Rim (Photo 2) -->
    <circle cx="-150" cy="0" r="88" fill="url(#sonoGrain)" />
    <circle cx="-150" cy="0" r="62" fill="#EDE8DF" />
    <!-- Reflection -->
    <circle cx="-150" cy="0" r="62" fill="url(#darkHighlight)" opacity="0.15" />

    <!-- Right Round Rim (Photo 2) -->
    <circle cx="150" cy="0" r="88" fill="url(#sonoGrain)" />
    <circle cx="150" cy="0" r="62" fill="#EDE8DF" />
    <!-- Reflection -->
    <circle cx="150" cy="0" r="62" fill="url(#darkHighlight)" opacity="0.15" />

    <!-- Keyhole Arched Nose Bridge -->
    <path d="M -65,-30 
             C -35,-45 35,-45 65,-30 
             C 45,-10 35,15 45,35 
             C 25,18 -25,18 -45,35 
             C -35,15 -45,-10 -65,-30 Z" 
          fill="url(#sonoGrain)" />

    <!-- Outer Endpieces and Hinges -->
    <rect x="-275" y="-20" width="40" height="24" rx="8" fill="url(#sonoGrain)" />
    <rect x="235" y="-20" width="40" height="24" rx="8" fill="url(#sonoGrain)" />
    <circle cx="-265" cy="-8" r="2.5" fill="#C5A059" />
    <circle cx="265" cy="-8" r="2.5" fill="#C5A059" />

    <!-- Top Highlight Ring for Round Bevel -->
    <path d="M -220,-45 C -180,-88 -120,-88 -80,-45" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />
    <path d="M 80,-45 C 120,-88 180,-88 220,-45" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />
  </g>

  <g transform="translate(400, 530)" opacity="0.85">
    <text text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#4A3B32">BJ Homemade • SONOKELING ROUND</text>
    <text y="18" text-anchor="middle" font-family="serif" font-style="italic" font-size="12" fill="#7A6253">Handcrafted Dark Espresso Timber • Product 02</text>
  </g>
</svg>