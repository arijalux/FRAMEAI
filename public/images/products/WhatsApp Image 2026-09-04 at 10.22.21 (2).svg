<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad6" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="60%" stop-color="#F0EDE6" />
      <stop offset="100%" stop-color="#E3DFD5" />
    </radialGradient>
    <linearGradient id="ebonyGrain" x1="0%" y1="0%" x2="100%" y2="10%">
      <stop offset="0%" stop-color="#1F1F21" />
      <stop offset="25%" stop-color="#303033" />
      <stop offset="50%" stop-color="#18181A" />
      <stop offset="75%" stop-color="#2B2B2E" />
      <stop offset="100%" stop-color="#151517" />
    </linearGradient>
    <filter id="softShadow6" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="20" flood-color="#121214" flood-opacity="0.26" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad6)" />
  <ellipse cx="400" cy="355" rx="300" ry="70" fill="rgba(20,20,22,0.22)" filter="blur(20px)" />

  <g transform="translate(400, 305) scale(1.05)" filter="url(#softShadow6)">
    <!-- Distinct Ultra-Wide Folded Paddle Temples (Photo 6) -->
    <path d="M-290,5 C-230,55 -160,82 -80,90 C-40,92 40,92 80,90 C160,82 230,55 290,5" 
          fill="none" stroke="url(#ebonyGrain)" stroke-width="28" stroke-linecap="round" opacity="0.95" />

    <!-- Continuous Architectural Flat-Top Browline (Photo 6) -->
    <rect x="-295" y="-75" width="590" height="32" rx="6" fill="url(#ebonyGrain)" />
    <line x1="-290" y1="-73" x2="290" y2="-73" stroke="rgba(255,255,255,0.3)" stroke-width="3" />

    <!-- Left Shield Rim (Photo 6) -->
    <path d="M -295,-45 
             L -35,-45 
             L -35,35 
             C -35,55 -55,65 -85,65 
             L -255,65 
             C -285,65 -295,50 -295,30 Z" 
          fill="url(#ebonyGrain)" />

    <!-- Right Shield Rim (Photo 6) -->
    <path d="M 295,-45 
             L 35,-45 
             L 35,35 
             C 35,55 55,65 85,65 
             L 255,65 
             C 285,65 295,50 295,30 Z" 
          fill="url(#ebonyGrain)" />

    <!-- Left Rectangular Lens -->
    <rect x="-270" y="-35" width="215" height="85" rx="10" fill="#EDE8DF" />
    <rect x="-270" y="-35" width="215" height="85" rx="10" fill="rgba(255,255,255,0.18)" />

    <!-- Right Rectangular Lens -->
    <rect x="55" y="-35" width="215" height="85" rx="10" fill="#EDE8DF" />
    <rect x="55" y="-35" width="215" height="85" rx="10" fill="rgba(255,255,255,0.18)" />

    <!-- Wide Paddle Temple Hinge Plates -->
    <rect x="-295" y="-65" width="15" height="45" rx="3" fill="#404044" />
    <rect x="280" y="-65" width="15" height="45" rx="3" fill="#404044" />
  </g>

  <g transform="translate(400, 530)" opacity="0.85">
    <text text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#36363A">BJ Homemade • ARCHITECTURAL FLAT-TOP</text>
    <text y="18" text-anchor="middle" font-family="serif" font-style="italic" font-size="12" fill="#686870">Signature Flat Brow with Paddle Temples • Product 04</text>
  </g>
</svg>